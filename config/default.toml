# Configuracao padrao do conversor TQS -> ETABS.
# Todas as distancias em metros. Ver ARCHITECTURE.md secoes 10 e 18.

[tolerances]
coordinate_cluster = 0.005     # mesma linha de alinhamento (5 mm)
rounding_decimals = 2          # coordenadas finais com 2 casas (cm)
node_merge = 0.005             # nos coincidentes
beam_column_snap = 0.010       # ajuste transversal viga -> eixo do pilar
max_end_extension = 0.35       # extensao longitudinal maxima da extremidade da viga
length_change_warning = 0.010  # variacao de comprimento tolerada apos normalizacao
area_check_relative = 0.02     # validacao cruzada de areas/volumes LDF x LST

[policy]
wall_aspect_ratio = 3.0        # pilar retangular com L/B > 3 -> shell
polygon_always_wall = true     # pilar poligonal (G) -> shell
ignore_vertical_offsets = true # DFS de vigas e lajes ignorado (tudo no nivel do piso)
stair_area_type = "membrane"   # laje 'ESCADA' -> elemento membrane
slab_area_type = "shell-thin"
include_load_only_nodes = false
units = "kN_m"
keep_tqs_origin = true
wall_opening_merge_max = 1.0  # une laminas colineares separadas por furo <= 1,0 m (registra INFO)

[grids]
x_prefix = "X"
y_prefix = "Y"
start_index = 1
secondary_grids_from_beams = false  # grids tambem nos eixos de vigas ortogonais
grids_at_frame_columns = true

[etabs]
version = "23.2.0"
decimal_separator = ","        # o ETABS le o E2K com o separador decimal do Windows (pt-BR: virgula)
default_material = "C40"       # fck de vigas e lajes (nao consta do LDF/LST)
concrete_unit_weight = 25.0    # kN/m3
beam_cardinal_point = 8        # 8 = topo-centro (padrao ETABS), 5 = centroide
apply_releases = false         # ARE/ARD do TQS (NEEDS_REVIEW) nao viram releases
assign_piers = true            # paineis de parede recebem PIER com o nome do pilar TQS
split_walls_at_nodes = true    # divide os paineis nos nos de viga/laje que caem sobre o eixo
base_restraint = "UX UY UZ RX RY RZ"
base_story_name = "BASE"
grid_system = "G1"
floor_mesh_max = 1.0
wall_mesh_max = 1.0
company = ""
