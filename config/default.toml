# Configuracao padrao do conversor TQS -> ETABS.
# Todas as distancias em metros. Ver ARCHITECTURE.md secoes 10 e 18.

[tolerances]
coordinate_cluster = 0.005     # mesma linha de alinhamento (5 mm)
rounding_decimals = 2          # coordenadas finais com 2 casas (cm)
node_merge = 0.005             # nos coincidentes
beam_column_snap = 0.010       # ajuste transversal viga -> eixo do pilar
max_end_extension = 0.35       # extensao longitudinal maxima da extremidade da viga
length_change_warning = 0.010  # variacao de comprimento tolerada apos normalizacao
area_check_relative = 0.02     # validacao cruzada de areas/volumes LDF x LST
wall_end_snap = 0.15           # viga a menos disto da ponta da parede e deslocada ate a ponta (no do pilar)
min_opening_area = 0.05        # reentrancia de bordo livre menor que isto e preenchida sem abertura
trim_wall_stub_max = 0.15      # toco terminal de parede sem no, menor que isto, e eliminado
slab_dent_flatten_max = 0.20   # degrau de bordo livre menor que isto e achatado (a laje cresce ate a linha vizinha)

[policy]
wall_aspect_ratio = 3.0        # pilar retangular com L/B > 3 -> shell
polygon_always_wall = true     # pilar poligonal (G) -> shell
ignore_vertical_offsets = true # DFS de vigas e lajes ignorado (tudo no nivel do piso)
stair_area_type = "membrane"   # laje 'ESCADA' -> elemento membrane
slab_area_type = "shell-thin"
include_load_only_nodes = false
units = "kN_m"
keep_tqs_origin = true
wall_opening_merge_max = 1.0  # une laminas colineares separadas por furo <= 1,0 m (registra INFO)
absorb_offset_slabs = true     # lajes rebaixadas/balanco entram na laje-mae (sem DFS)
simplify_slab_outlines = true  # reentrancias de bordo livre -> contorno reto pelas linhas de apoio + abertura
openings = "opening"           # "opening" = area OPENING no ETABS; "fill" = so preenche

[grids]
x_style = "letters"            # A, B, C... (como no modelo de referencia)
y_style = "numbers"            # 1, 2, 3...
x_prefix = "X"                 # usado so com style = "prefix"
y_prefix = "Y"
start_index = 1
secondary_grids_from_beams = false  # grids tambem nos eixos de vigas ortogonais
grids_at_frame_columns = true
boundary_tolerance = 0.25           # grid de extremo so e criado se o ultimo eixo estiver a mais que isto (m)

[etabs]
version = "23.2.0"
decimal_separator = ","        # o ETABS le o E2K com o separador decimal do Windows (pt-BR: virgula)
default_material = "C40"       # fck de vigas e lajes (nao consta do LDF/LST)
concrete_unit_weight = 25.0    # kN/m3
beam_cardinal_point = 8        # 8 = topo-centro (padrao ETABS), 5 = centroide
apply_releases = false         # ARE/ARD do TQS (NEEDS_REVIEW) nao viram releases
assign_piers = true            # paineis de parede recebem PIER com o nome do pilar TQS
split_walls_at_nodes = true    # divide os paineis nos nos de viga/laje que caem sobre o eixo
base_restraint = "UX UY UZ RX RY RZ"
base_story_name = "BASE"
grid_system = "G1"
floor_mesh_max = 1.0
wall_mesh_max = 1.0
company = ""
export_loads = true            # cargas de laje (ADI) e de viga (DIS) dos casos 3 (permanente) e 4 (acidental)
include_columns = true         # selecao do que importar (pilares/paredes, vigas, lajes)
include_beams = true
include_slabs = true
template_path = ""             # .e2k de referencia do escritorio (materiais, secoes, casos, combinacoes)
template_definitions = true    # materiais, secoes, diafragmas, funcoes e preferencias de dimensionamento
template_analysis = true       # load patterns, load cases, mass source e opcoes de analise (P-Delta, malha)
template_combos = true         # combinacoes de carga
origin_at_min_corner = true    # (0,0) no canto inferior esquerdo do perimetro
bounding_grids = true          # cria grid nos extremos do perimetro (inclui pontas de viga e bordo de laje)
tf_to_kn = 9.80665
pattern_dead_extra = "SDL"     # padrao de carga permanente adicional (Super Dead)
pattern_live = "RLIVE"         # padrao de carga acidental de uso (Reducible Live, convencao do escritorio)
pattern_live_type = "Reducible Live"
mass_live_factor = 0.25
